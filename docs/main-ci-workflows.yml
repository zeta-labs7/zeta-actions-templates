name: Continous Integration

on:
  workflow_call:
    inputs:
      source-repo:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      image-name:
        required: true
        type: string
      push-image:
        type: boolean
        default: false

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      source-repo: ${{ inputs.source-repo }}
      source-ref: ${{ inputs.source-ref }}

